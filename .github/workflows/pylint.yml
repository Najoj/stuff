name: Pylint Changed Files

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYLINT_CMD: "pylint"

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify file changes
        id: changed-files
        uses: ./.github/actions/detect-changed-files
        with:
          file_pattern: '**/*.py'
          workflow_path: '.github/workflows/pylint.yml'

      - name: Setup Python
        if: steps.changed-files.outputs.target_changed == 'true' || steps.changed-files.outputs.workflow_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pylint and dependencies
        if: steps.changed-files.outputs.target_changed == 'true' || steps.changed-files.outputs.workflow_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pylint
        if: steps.changed-files.outputs.target_changed == 'true' || steps.changed-files.outputs.workflow_changed == 'true'
        run: |
          if [ "${{ steps.changed-files.outputs.workflow_changed }}" = "true" ]; then
            echo "Workflow changed – running Pylint on ALL .py files..."
            find . -type f -name "*.py" -not -path "*/.*" | xargs $PYLINT_CMD
          else
            echo "Running Pylint on changed .py files: ${{ steps.changed-files.outputs.changed_files }}"
            $PYLINT_CMD ${{ steps.changed-files.outputs.changed_files }}
          fi

