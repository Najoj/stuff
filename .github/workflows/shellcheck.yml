name: ShellCheck Changed Files

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  SHELLCHECK_CMD: "shellcheck -e SC1090,SC1091"

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify file changes
        id: changed-files
        uses: ./.github/actions/detect-changed-files
        with:
          file_pattern: '**/*.sh'
          workflow_path: '.github/workflows/shellcheck.yml'

      - name: Run ShellCheck
        if: steps.changed-files.outputs.target_changed == 'true' || steps.changed-files.outputs.workflow_changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

          if [ "${{ steps.changed-files.outputs.workflow_changed }}" = "true" ]; then
            echo "Workflow changed – running ShellCheck on ALL .sh files..."
            find . -type f -name "*.sh" -exec $SHELLCHECK_CMD {} +
          else
            echo "Running ShellCheck on changed .sh files..."
            $SHELLCHECK_CMD ${{ steps.changed-files.outputs.changed_files }}
          fi
